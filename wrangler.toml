# Deployed as a Worker serving static assets, the same shape as xebecstudios.org.
#
# Static pages come from the built site in ./dist. The Worker also runs the sample
# SSF Transmitter and Receiver (worker/*.ts); see worker/index.ts for the routes.
#
# Keep `name` matching the Worker shown in the Cloudflare dashboard. Workers Builds
# deploys under its own project name, but `wrangler secret put` uses this one, and a
# mismatch silently creates an empty second Worker.
name = "shared-signals-dev"
main = "worker/index.ts"
compatibility_date = "2026-01-01"
# Served only on shared-signals.dev (custom domain set in the dashboard), not on
# *.workers.dev, so there is one canonical address.
workers_dev = false

# Workers Logs: keep a searchable log of every request that reaches the Worker (the API and
# playground backend, not static pages) for troubleshooting. Dashboard: the Worker → Logs.
[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./dist"
binding = "ASSETS"
# Only these paths reach the Worker before the asset handler. Everything else is a
# static file.
run_worker_first = ["/.well-known/ssf-configuration*", "/.well-known/oauth-authorization-server", "/.well-known/oauth-protected-resource*", "/jwks.json", "/ssf/*", "/api/*"]
not_found_handling = "404-page"

# State for the sample Transmitter (one object per OAuth client), Receiver (one per receiver id)
# and the generated signing key. SQLite-backed, which the Workers Free plan requires.
[[durable_objects.bindings]]
name = "SANDBOX"
class_name = "SandboxTransmitter"

[[durable_objects.bindings]]
name = "SAMPLE_RECEIVER"
class_name = "SandboxReceiver"

[[durable_objects.bindings]]
name = "KEYS"
class_name = "KeyStore"

# Optional passkey accounts (one object per account).
[[durable_objects.bindings]]
name = "ACCOUNT"
class_name = "Account"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Transmitter", "Receiver", "KeyStore"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Account"]

# 2026-10-14: one sandbox at a time. Deletes every sandbox and sample Receiver created before
# (all their storage), and starts fresh classes under new binding names (Cloudflare refuses to delete a
# class while a binding of the old name remains). Accounts and the signing key are untouched.
[[migrations]]
tag = "v3"
deleted_classes = ["Transmitter", "Receiver"]
new_sqlite_classes = ["SandboxTransmitter", "SandboxReceiver"]

# Per-IP limit on /ssf/* and /api/*. namespace_id is any account-unique integer.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# The signing key: set SSF_SIGNING_KEY (an RSA PKCS#8 PEM or JWK) with
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | npx wrangler secret put SSF_SIGNING_KEY
# Until it is set, the Worker generates a key once and keeps it in the KEYS Durable Object.
